    @keyframes fire { 0%, 100% { opacity: .08; } 20% { opacity: .95; } 45% { opacity: .08; } }

    .pulse { animation-duration: 4s; } .glow { animation-duration: 4s; }
    .edge { stroke-opacity: .16; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
