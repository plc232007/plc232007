<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Leite Campos — Desenvolvedor fullstack</title>
  <desc id="desc">Laboratório de desenvolvimento com fundo quadriculado, órbitas conectando interface, lógica e dados, e terminal com o percurso de requisitos até a entrega.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101d30"/><stop offset="1" stop-color="#0a101b"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#63dfd0"/><stop offset="1" stop-color="#93a9ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#91b7d8" stroke-opacity=".065"/>
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#3caea1" stop-opacity=".15"/><stop offset="1" stop-color="#3caea1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; }
    .muted { fill: #a1b4cb; }
    .orbit { transform-origin: 712px 180px; animation: orbit 48s linear infinite; }
    .cursor { animation: blink 1.4s steps(2, jump-none) infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes blink { to { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .orbit, .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="878" height="398" rx="20" fill="url(#background)" stroke="#2b3c52"/>
  <rect x="2" y="2" width="876" height="396" rx="20" fill="url(#grid)"/>
  <circle cx="700" cy="172" r="190" fill="url(#glow)"/>
  <path d="M30 51H850" stroke="#2b3c52"/>
  <g class="mono" font-size="11" letter-spacing="1.4">
    <circle cx="33" cy="29" r="4" fill="#63dfd0"/>
    <text x="47" y="33" fill="#cbd8e9">PLC / DEV LAB</text>
    <text x="848" y="33" text-anchor="end" class="muted">IDEIAS → SOFTWARE</text>
  </g>
  <text x="40" y="92" class="mono" font-size="12" fill="#63dfd0" letter-spacing="2">OLÁ, EU SOU</text>
  <text x="37" y="142" font-size="43" font-weight="750" fill="#f1f5fc" letter-spacing="-1.5">Pedro Leite Campos</text>
  <text x="40" y="175" font-size="20" fill="#c5d2e6">Desenvolvedor fullstack</text>
  <rect x="40" y="194" width="68" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="228" font-size="15" class="muted">Escuto o problema. Desenho a solução.</text>
  <text x="40" y="251" font-size="15" class="muted">Construo para colocar em uso.</text>
  <g fill="none" stroke="#40586e">
    <circle cx="712" cy="180" r="88" stroke-dasharray="3 8"/>
    <ellipse cx="712" cy="180" rx="115" ry="51" transform="rotate(-35 712 180)"/>
    <ellipse cx="712" cy="180" rx="115" ry="51" transform="rotate(35 712 180)"/>
    <path d="M712 105V145M641 221L681 198M783 221L743 198" stroke="#63dfd0" stroke-opacity=".6"/>
  </g>
  <g class="orbit"><circle cx="712" cy="92" r="4" fill="#63dfd0"/><circle cx="712" cy="268" r="3" fill="#a3afff"/></g>
  <rect x="673" y="143" width="78" height="74" rx="21" fill="#13283a" stroke="#63dfd0"/>
  <text x="712" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#edf8ff">PLC</text>
  <g class="mono" font-size="11" text-anchor="middle">
    <rect x="668" y="77" width="88" height="28" rx="14" fill="#182637" stroke="#4b627c"/>
    <text x="712" y="95" fill="#cbd8e9">interface</text>
    <rect x="600" y="219" width="76" height="28" rx="14" fill="#182637" stroke="#4b627c"/>
    <text x="638" y="237" fill="#cbd8e9">lógica</text>
    <rect x="755" y="219" width="76" height="28" rx="14" fill="#182637" stroke="#4b627c"/>
    <text x="793" y="237" fill="#cbd8e9">dados</text>
  </g>
  <rect x="40" y="282" width="800" height="67" rx="10" fill="#0a1320" stroke="#2b3c52"/>
  <g class="mono" font-size="12">
    <text x="57" y="308" fill="#63dfd0">~/pedro <tspan fill="#d3deec">$ build --from requisitos --to entrega</tspan></text>
    <text x="57" y="330" class="muted"><tspan fill="#a3afff">↳</tspan> entender · prototipar · desenvolver · aprender</text>
    <rect class="cursor" x="472" y="320" width="7" height="12" fill="#63dfd0"/>
  </g>
  <g class="mono" font-size="10" letter-spacing="1">
    <text x="40" y="376" class="muted">PYTHON / TYPESCRIPT / REACT / NEXT.JS</text>
    <text x="840" y="376" text-anchor="end" fill="#63dfd0">CURIOSIDADE EM CONSTRUÇÃO ↗</text>
  </g>
</svg>
