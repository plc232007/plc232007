<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Pedro Leite Campos — desenvolvedor fullstack</title>
  <desc id="d">Painel de terminal: monograma PLC desenhado a traço e ficha com cargo, curso, stack, deploys e status.</desc>

  <style>
    :root { color-scheme: dark; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .lbl  { fill: #56D364; }
    .val  { fill: #C9D1D9; }
    .dim  { fill: #6E7681; }
    .cy   { fill: #58A6FF; }

    .ltr { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 9; }
    #p { stroke: #58A6FF; stroke-dasharray: 340; stroke-dashoffset: 340; animation: dp 14s linear infinite; }
    #l { stroke: #8B949E; stroke-dasharray: 220; stroke-dashoffset: 220; animation: dl 14s linear infinite; }
    #c { stroke: #56D364; stroke-dasharray: 300; stroke-dashoffset: 300; animation: dc 14s linear infinite; }

    @keyframes dp { 0%,1% { stroke-dashoffset: 340 } 9%,100% { stroke-dashoffset: 0 } }
    @keyframes dl { 0%,4% { stroke-dashoffset: 220 } 13%,100% { stroke-dashoffset: 0 } }
    @keyframes dc { 0%,7% { stroke-dashoffset: 300 } 17%,100% { stroke-dashoffset: 0 } }

    #stage { animation: out 14s linear infinite; }
    @keyframes out { 0%,90% { opacity: 1 } 95%,100% { opacity: 0 } }

    #k1 { animation: r1 14s steps(14) infinite }
    #k2 { animation: r2 14s linear infinite }
    #k3 { animation: r3 14s steps(44) infinite }
    #k4 { animation: r4 14s steps(36) infinite }
    #k5 { animation: r5 14s steps(50) infinite }
    #k6 { animation: r6 14s steps(52) infinite }
    #k7 { animation: r7 14s steps(37) infinite }
    #k8 { animation: r8 14s steps(16) infinite }

    @keyframes r1 { 0%,18% { width: 0 } 22%,100% { width: 130px } }
    @keyframes r2 { 0%,23% { width: 0 } 26%,100% { width: 460px } }
    @keyframes r3 { 0%,27% { width: 0 } 32%,100% { width: 400px } }
    @keyframes r4 { 0%,33% { width: 0 } 38%,100% { width: 330px } }
    @keyframes r5 { 0%,39% { width: 0 } 45%,100% { width: 450px } }
    @keyframes r6 { 0%,46% { width: 0 } 52%,100% { width: 470px } }
    @keyframes r7 { 0%,53% { width: 0 } 58%,100% { width: 340px } }
    @keyframes r8 { 0%,59% { width: 0 } 63%,100% { width: 150px } }

    #cur  { animation: gate 14s linear infinite }
    #curb { animation: blink 1.05s steps(1) infinite }
    @keyframes gate { 0%,62% { opacity: 0 } 63%,100% { opacity: 1 } }
    @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      #p, #l, #c { stroke-dashoffset: 0; animation: none }
      #stage { animation: none }
      #k1 { width: 130px } #k2 { width: 460px } #k3 { width: 400px } #k4 { width: 330px }
      #k5 { width: 450px } #k6 { width: 470px } #k7 { width: 340px } #k8 { width: 150px }
      #k1,#k2,#k3,#k4,#k5,#k6,#k7,#k8 { animation: none }
      #cur { opacity: 1; animation: none } #curb { animation: none }
    }
  </style>

  <defs>
    <clipPath id="c1"><rect id="k1" x="330" y="76"  height="22" width="0"/></clipPath>
    <clipPath id="c2"><rect id="k2" x="330" y="104" height="6"  width="0"/></clipPath>
    <clipPath id="c3"><rect id="k3" x="330" y="122" height="22" width="0"/></clipPath>
    <clipPath id="c4"><rect id="k4" x="330" y="150" height="22" width="0"/></clipPath>
    <clipPath id="c5"><rect id="k5" x="330" y="178" height="22" width="0"/></clipPath>
    <clipPath id="c6"><rect id="k6" x="330" y="206" height="22" width="0"/></clipPath>
    <clipPath id="c7"><rect id="k7" x="330" y="234" height="22" width="0"/></clipPath>
    <clipPath id="c8"><rect id="k8" x="330" y="262" height="22" width="0"/></clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="318" rx="14" fill="#0D1117" stroke="#21262D" stroke-width="2"/>
  <path d="M1 43 H879" stroke="#21262D" stroke-width="2"/>
  <circle cx="28" cy="22" r="6" fill="#F85149"/>
  <circle cx="50" cy="22" r="6" fill="#D29922"/>
  <circle cx="72" cy="22" r="6" fill="#3FB950"/>
  <text class="mono dim" x="440" y="27" font-size="13" text-anchor="middle">plc232007 — zsh</text>

  <g id="stage">
    <g transform="translate(0,14)">
      <path id="p" class="ltr" d="M70 118 V244 M70 118 H104 a27 27 0 0 1 0 54 H70"/>
      <path id="l" class="ltr" d="M150 118 V244 H198"/>
      <path id="c" class="ltr" d="M286 152 a42 42 0 1 0 0 58"/>
    </g>

    <g class="mono" font-size="15">
      <g clip-path="url(#c1)"><text x="330" y="92" class="cy">pedro@github</text></g>
      <g clip-path="url(#c2)"><rect x="330" y="105" width="460" height="2" fill="#21262D"/></g>
      <g clip-path="url(#c3)"><text y="138"><tspan class="lbl" x="330">cargo</tspan><tspan class="val" x="425">estagiário fullstack @ Engesoftware</tspan></text></g>
      <g clip-path="url(#c4)"><text y="166"><tspan class="lbl" x="330">curso</tspan><tspan class="val" x="425">ciência da computação, IESB</tspan></text></g>
      <g clip-path="url(#c5)"><text y="194"><tspan class="lbl" x="330">stack</tspan><tspan class="val" x="425">python, typescript, next, django, laravel</tspan></text></g>
      <g clip-path="url(#c6)"><text y="222"><tspan class="lbl" x="330">deploy</tspan><tspan class="val" x="425">4 apps em produção, 70+ usuários reais</tspan></text></g>
      <g clip-path="url(#c7)"><text y="250"><tspan class="lbl" x="330">status</tspan><tspan class="val" x="425">aberto a estágio e freelance</tspan></text></g>
      <g clip-path="url(#c8)"><text x="330" y="278" class="dim">pedro@github:~$</text></g>
      <g id="cur"><rect id="curb" x="470" y="263" width="9" height="17" fill="#58A6FF"/></g>
    </g>
  </g>
</svg>
