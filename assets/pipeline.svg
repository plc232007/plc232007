    <circle cx="44.0" cy="74" r="12" fill="#63dfd0" class="glow" style="animation-delay:0.0s"/>
    <circle cx="44.0" cy="74" r="6" fill="#0d1726" stroke="#63dfd0" stroke-width="1.6"/>
    <text x="152.0" y="79" text-anchor="end" class="mono" font-size="11" fill="#6f86a3">01</text>
    <text x="36.0" y="112" font-size="16" font-weight="650" fill="#f1f5fc">Dados</text>
    <text x="36.0" y="133" class="mono" font-size="10.5" fill="#a1b4cb">coleta e</text>
    <text x="36.0" y="148" class="mono" font-size="10.5" fill="#a1b4cb">anotação</text>
  </g>
  <g>
    <rect x="193.0" y="46" width="148" height="112" rx="14" fill="#0f1a2a" stroke="#2b3c52"/>
    <rect x="193.0" y="46" width="148" height="112" rx="14" fill="none" stroke="#93a9ff" class="lit" style="animation-delay:0.6s"/>
    <circle cx="217.0" cy="74" r="12" fill="#93a9ff" class="glow" style="animation-delay:0.6s"/>
