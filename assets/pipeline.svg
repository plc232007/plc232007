    <rect x="712.0" y="46" width="148" height="112" rx="14" fill="none" stroke="#63dfd0" class="lit" style="animation-delay:2.4s"/>
    <circle cx="736.0" cy="74" r="12" fill="#63dfd0" class="glow" style="animation-delay:2.4s"/>
    <circle cx="736.0" cy="74" r="6" fill="#0d1726" stroke="#63dfd0" stroke-width="1.6"/>
    <text x="844.0" y="79" text-anchor="end" class="mono" font-size="11" fill="#6f86a3">05</text>
    <text x="728.0" y="112" font-size="16" font-weight="650" fill="#f1f5fc">Produto</text>
    <text x="728.0" y="133" class="mono" font-size="10.5" fill="#a1b4cb">API · banco</text>
    <text x="728.0" y="148" class="mono" font-size="10.5" fill="#a1b4cb">· interface</text>
  </g>
  <path d="M171.0 102H190.0" stroke="#3a516b" stroke-width="2"/><circle r="3.5" fill="#63dfd0"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M171.0 102H190.0"/></circle><path d="M344.0 102H363.0" stroke="#3a516b" stroke-width="2"/><circle r="3.5" fill="#93a9ff"><animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M344.0 102H363.0"/></circle><path d="M517.0 102H536.0" stroke="#3a516b" stroke-width="2"/><circle r="3.5" fill="#c49bff"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M517.0 102H536.0"/></circle><path d="M690.0 102H709.0" stroke="#3a516b" stroke-width="2"/><circle r="3.5" fill="#f2c46d"><animateMotion dur="3s" begin="1.7999999999999998s" repeatCount="indefinite" path="M690.0 102H709.0"/></circle>
