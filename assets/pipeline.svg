    <text x="382.0" y="148" class="mono" font-size="10.5" fill="#a1b4cb">PyTorch</text>
  </g>
  <g>
    <rect x="539.0" y="46" width="148" height="112" rx="14" fill="#0f1a2a" stroke="#2b3c52"/>
