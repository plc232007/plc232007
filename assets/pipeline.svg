<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-labelledby="title desc">
  <title id="title">Do pixel ao produto</title>
  <desc id="desc">Pipeline de visão computacional: dados, pré-processamento, treino, avaliação e produto, com retorno da avaliação para os dados.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .mono, .mono text { font-family: "DejaVu Sans Mono", Consolas, monospace; }
    .muted { fill: #a1b4cb; }
    .edge { stroke: #4a6480; stroke-opacity: .28; }
    .pulse { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 10 110;
             stroke-dashoffset: 10; animation: travel 3.2s linear infinite; }
    .glow { opacity: .08; animation: fire 3.2s ease-in-out infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 10; } 55%, 100% { stroke-dashoffset: -110; } }
    @keyframes fire { 0%, 100% { opacity: .08; } 20% { opacity: .95; } 45% { opacity: .08; } }

    .lit { opacity: 0; animation: lit 3s ease-in-out infinite; }
    .glow { animation-duration: 3s; }
    @keyframes lit { 0%, 100% { opacity: 0; } 15% { opacity: .9; } 40% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="878" height="208" rx="18" fill="#0b1320" stroke="#22324a"/>
  <text x="20.0" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#63dfd0">DO PIXEL AO PRODUTO</text>
  <text x="860.0" y="30" text-anchor="end" class="mono" font-size="11" letter-spacing="1.4" fill="#6f86a3">entender → mapear → construir → iterar</text>
  
